<!DOCTYPE html>
<html lang="zh-CN">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>智学伴 - 个性化学习伴侣</title>
        <link rel="stylesheet" href="/static/css/style.css">
        <!-- 预加载关键资源 -->
        <link rel="preload" href="/static/css/style.css" as="style">
        <!-- 懒加载非关键资源 -->
        <script defer src="/static/js/shared.js?v=fix-text-20260612"></script>
    </head>
<body>
    <!-- 导航栏 -->
    {% include 'components/navbar.html' %}
    
    <!-- 主内容容器 -->
    <div class="main-wrapper">
        <!-- 页面内容区域 -->
        <div id="pageContent" class="page-content">
            <!-- 首页内容 -->
            <div id="homePage" class="page">
                <!-- 聊天历史侧边栏 -->
                <aside class="history-sidebar">
                    <div class="history-panel">
                        <div class="history-header">
                            <span class="history-header-icon">📜</span>
                            <h3>聊天历史</h3>
                        </div>
                        <div class="history-list" id="historyList">
                            <div class="history-empty">
                                <div class="history-empty-icon">📝</div>
                                <div>暂无聊天记录</div>
                            </div>
                        </div>
                    </div>
                </aside>

                <!-- 聊天区域 -->
                <main class="chat-area">
                    <h1 class="page-title">智能答疑</h1>
                    
                    <!-- 对话容器 -->
                    <div class="chat-container">
                        <div class="chat-header">
                            <div class="chat-header-icon">🤖</div>
                            <div class="chat-header-info">
                                <h3>智学伴学习伙伴</h3>
                                <p>专属学习助手，随时为你答疑解惑</p>
                            </div>
                            <div class="model-switch-wrapper">
                                <div class="model-status" id="modelStatus">
                                    <span class="status-dot"></span>
                                    <span class="status-text">检查中...</span>
                                </div>
                                <div class="kb-toggle-wrapper">
                                    <span class="kb-toggle-label">🧠 知识库</span>
                                    <div class="kb-toggle">
                                        <button class="kb-toggle-btn" id="kbToggleBtn" onclick="toggleKnowledgeBase()">
                                            <span class="kb-toggle-switch"></span>
                                        </button>
                                    </div>
                                    <span class="kb-toggle-status" id="kbToggleStatus">关闭</span>
                                    <div class="kb-selector" id="kbSelector" style="display: none;">
                                        <select id="knowledgeBaseSelect" onchange="saveKnowledgeBasePreference()">
                                            <option value="">暂无知识库</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="chat-messages" id="chatMessages">
                            <div class="message ai">
                                <div class="message-avatar">🤖</div>
                                <div class="message-content">
                                    你好！我是你的学习伙伴 👋<br><br>
                                    我可以帮你：<br>
                                    • 解答学习问题<br>
                                    • 解释概念和公式<br>
                                    • 提供学习建议<br><br>
                                    请在下方输入你的问题，开始学习吧！
                                </div>
                            </div>
                        </div>
                        
                        <div class="chat-input-area">
                            <input type="text" class="chat-input" id="questionInput" placeholder="输入你的学习问题..." onkeypress="handleKeyPress(event)">
                            <button class="chat-send-btn" onclick="sendQuestion()">发送</button>
                        </div>
                    </div>
                </main>
            </div>

            <!-- 个人中心页面 -->
            <div id="profilePage" class="page" style="display: none;">
                <main class="profile-page">
                    <h1 class="page-title">个人中心</h1>
                    
                    <!-- 个人信息卡片 -->
                    <div class="profile-card">
                        <div class="profile-header">
                            <div class="avatar-container">
                                <button class="profile-avatar-btn" id="profileAvatar" onclick="changeAvatar()" title="点击更换头像"></button>
                                <div class="avatar-hint">点击更换头像</div>
                            </div>
                            <div class="profile-info">
                                <h2 id="profileUsername">用户名</h2>
                                <p id="profileEmail">邮箱</p>
                                <p id="profileMajor">专业</p>
                                <p id="profileGrade">年级</p>
                            </div>
                        </div>
                        <input type="file" id="avatarInput" accept="image/*" style="display: none;">
                        <div class="profile-actions">
                            <button class="action-btn" onclick="editProfile()">
                                <span class="btn-icon">✏️</span>
                                编辑资料
                            </button>
                            <button class="action-btn" onclick="changePassword()">
                                <span class="btn-icon">🔒</span>
                                修改密码
                            </button>
                        </div>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <!-- 编辑资料弹窗 -->
    <div class="modal" id="editModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>编辑资料</h3>
                <button class="close-btn" onclick="closeEditModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="editForm">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="editUsername" required>
                    </div>
                    <div class="form-group">
                        <label>邮箱</label>
                        <input type="email" id="editEmail" required>
                    </div>
                    <div class="form-group">
                        <label>专业</label>
                        <input type="text" id="editMajor">
                    </div>
                    <div class="form-group">
                        <label>年级</label>
                        <input type="text" id="editGrade">
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn cancel" onclick="closeEditModal()">取消</button>
                        <button type="submit" class="btn submit">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 修改密码弹窗 -->
    <div class="modal" id="passwordModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>修改密码</h3>
                <button class="close-btn" onclick="closePasswordModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="passwordForm">
                    <div class="form-group">
                        <label>旧密码</label>
                        <input type="password" id="oldPassword" required>
                    </div>
                    <div class="form-group">
                        <label>新密码</label>
                        <input type="password" id="newPassword" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label>确认新密码</label>
                        <input type="password" id="confirmPassword" required minlength="6">
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn cancel" onclick="closePasswordModal()">取消</button>
                        <button type="submit" class="btn submit">修改</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // 页面管理
        const pages = {
            home: document.getElementById('homePage'),
            profile: document.getElementById('profilePage')
        };

        // 页面内容缓存
        const pageCache = {
            home: { 
                loaded: false, 
                timestamp: 0,
                data: null
            },
            profile: { 
                loaded: false, 
                timestamp: 0,
                data: null
            }
        };

        // 切换页面
        function switchPage(pageName) {
            if (pageName === 'knowledge') {
                window.location.href = '/knowledge-base';
                return;
            }

            // 记录开始时间
            const startTime = performance.now();
            
            // 控制侧边栏显示/隐藏
            const sidebar = document.querySelector('.history-sidebar');
            if (sidebar) {
                if (pageName === 'home') {
                    sidebar.style.display = 'block';
                } else {
                    sidebar.style.display = 'none';
                }
            }
            
            // 使用CSS类控制页面显示/隐藏，减少重绘重排
            Object.keys(pages).forEach(key => {
                if (key === pageName) {
                    pages[key].classList.add('page-active');
                    pages[key].classList.remove('page-hidden');
                } else {
                    pages[key].classList.remove('page-active');
                    pages[key].classList.add('page-hidden');
                }
            });

            // 批量更新导航栏激活状态，减少DOM操作次数
            const navItems = document.querySelectorAll('.nav-item');
            let targetNavItem;
            
            if (pageName === 'home') {
                targetNavItem = document.querySelector('.nav-item[href="/"]');
            } else if (pageName === 'profile') {
                targetNavItem = document.querySelector('.nav-item[href="/profile"]');
            }
            
            navItems.forEach(item => {
                item.classList.remove('active');
            });
            if (targetNavItem) {
                targetNavItem.classList.add('active');
            }

            // 加载页面内容（如果尚未加载或缓存过期）
            loadPageContent(pageName).then(() => {
                // 记录结束时间
                const endTime = performance.now();
                // 计算响应时间
                const responseTime = endTime - startTime;
                console.log(`页面切换到 ${pageName} 耗时: ${responseTime.toFixed(2)}ms`);
                
                // 显示性能提示
                if (responseTime < 300) {
                    console.log('✅ 页面切换性能良好，响应时间在300ms以内');
                } else {
                    console.log('⚠️  页面切换性能需要优化，响应时间超过300ms');
                }
            });
        }

        // 加载页面内容
        async function loadPageContent(pageName) {
            const now = Date.now();
            const cache = pageCache[pageName];
            
            // 检查缓存是否有效（5分钟内）
            if (!cache.loaded || (now - cache.timestamp) > 5 * 60 * 1000) {
                // 使用 requestAnimationFrame 确保DOM操作在浏览器重绘周期中执行
                await new Promise(resolve => requestAnimationFrame(resolve));
                
                switch (pageName) {
                    case 'home':
                        cache.data = await loadHomeContent();
                        break;
                    case 'profile':
                        cache.data = await loadProfileContent();
                        break;
                }
                cache.loaded = true;
                cache.timestamp = now;
            } else {
                console.log(`页面 ${pageName} 使用缓存数据`);
            }
        }

        // 刷新页面缓存
        function refreshPageCache(pageName) {
            const cache = pageCache[pageName];
            if (cache) {
                cache.loaded = false;
                cache.timestamp = 0;
                cache.data = null;
                console.log(`页面 ${pageName} 缓存已刷新`);
            }
        }

        // 刷新所有页面缓存
        function refreshAllCache() {
            Object.keys(pageCache).forEach(pageName => {
                refreshPageCache(pageName);
            });
        }

        // 加载首页内容
        async function loadHomeContent() {
            // 加载聊天历史
            if (typeof loadChatHistory === 'function') {
                await loadChatHistory();
            }
            // 加载模型偏好
            if (typeof loadModelPreference === 'function') {
                loadModelPreference();
            }
            // 加载知识库偏好
            if (typeof loadKnowledgeBasePreference === 'function') {
                loadKnowledgeBasePreference();
            }
            // 加载知识库列表
            if (typeof loadKnowledgeBases === 'function') {
                await loadKnowledgeBases();
            }
        }

        // 加载个人中心页面内容
        async function loadProfileContent() {
            // 加载用户信息
            if (typeof loadUserInfo === 'function') {
                await loadUserInfo();
            }
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化导航栏点击事件
            initNavbarEvents();
            
            // 根据当前 URL 选择初始页面
            const currentPath = window.location.pathname;
            let initialPage = 'home';
            
            if (currentPath === '/profile') {
                initialPage = 'profile';
            } else if (currentPath === '/knowledge-base') {
                initialPage = 'knowledge';
            }
            
            switchPage(initialPage);
        });

        // 初始化导航栏事件
        function initNavbarEvents() {
            // 阻止导航栏链接的默认行为，但个人中心除外
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', function(e) {
                    const href = this.getAttribute('href');
                    
                    // 如果是个人中心链接，不阻止默认行为，直接跳转
                    if (href === '/profile' || href === '/knowledge-base' || href === '/admin') {
                        return;
                    }
                    
                    e.preventDefault();
                    let pageName = 'home';
                    
                    switchPage(pageName);
                });
            });
            
            // 用户信息部分的个人中心链接直接跳转，不阻止默认行为
            // 所以这里不需要添加事件监听器
            
            // 阻止logo点击的默认行为
            const logo = document.querySelector('.logo');
            if (logo) {
                logo.addEventListener('click', function(e) {
                    e.preventDefault();
                    switchPage('home');
                });
            }
        }

        // 首页相关变量
        let currentSessionId = null;
        let currentModelType = 'ollama';
        let knowledgeBaseEnabled = false;
        let currentKnowledgeBase = '';

        function getKnowledgeBaseDisplayName(item) {
            return item.display_name || item.class_name || item.name;
        }

        // 加载所有知识库列表
        async function loadKnowledgeBases() {
            try {
                const token = localStorage.getItem('token') || getCookie('token');
                const response = await fetch('/api/knowledge-base/list', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                const data = await response.json();
                
                if (data.code === 200) {
                    const availableKnowledgeBases = data.items || [];
                    if (!availableKnowledgeBases.some(kb => kb.name === currentKnowledgeBase)) {
                        currentKnowledgeBase = availableKnowledgeBases[0]?.name || '';
                        if (currentKnowledgeBase) {
                            localStorage.setItem('currentKnowledgeBase', currentKnowledgeBase);
                        } else {
                            localStorage.removeItem('currentKnowledgeBase');
                        }
                    }

                    const select = document.getElementById('knowledgeBaseSelect');
                    if (select) {
                        // 清空现有选项
                        select.innerHTML = '';

                        if (!availableKnowledgeBases.length) {
                            const option = document.createElement('option');
                            option.value = '';
                            option.textContent = '暂无知识库';
                            option.selected = true;
                            select.appendChild(option);
                        }

                        // 添加所有知识库选项
                        availableKnowledgeBases.forEach(kb => {
                            const option = document.createElement('option');
                            option.value = kb.name;
                            option.textContent = getKnowledgeBaseDisplayName(kb);
                            if (kb.name === currentKnowledgeBase) {
                                option.selected = true;
                            }
                            select.appendChild(option);
                        });
                    }
                }
            } catch (error) {
                console.error('加载知识库列表失败:', error);
            }
        }
        
        // 保存知识库选择偏好
        function saveKnowledgeBasePreference() {
            const select = document.getElementById('knowledgeBaseSelect');
            if (select) {
                currentKnowledgeBase = select.value;
                localStorage.setItem('currentKnowledgeBase', currentKnowledgeBase);
            }
        }

        // 个人中心页面相关函数
        // 加载用户信息（个人中心页面专用）
        async function loadUserInfo() {
            const user = getCurrentUser();
            if (!user) {
                location.href = '/login';
                return;
            }

            // 检查全局缓存是否有效
            const now = Date.now();
            if (globalCache.userInfo && (now - globalCache.lastFetch.userInfo < globalCache.cacheTime)) {
                displayProfileUserInfo(globalCache.userInfo);
                return;
            }

            try {
                // 使用综合API端点
                const response = await fetch(`/api/dashboard?user_id=${user.id}`);
                const data = await response.json();
                
                if (data.code === 200) {
                    globalCache.userInfo = data.data.user;
                    globalCache.lastFetch.userInfo = now;
                    globalCache.modelStatus = data.data.model_status;
                    globalCache.lastFetch.modelStatus = now;
                    displayProfileUserInfo(data.data.user);
                }
            } catch (error) {
                console.error('加载用户信息失败:', error);
                // 使用本地存储的用户信息作为后备
                displayProfileUserInfo(user);
            }
        }

        // 显示用户信息（个人中心页面专用）
        function displayProfileUserInfo(user) {
            document.getElementById('profileUsername').textContent = user.username;
            document.getElementById('profileEmail').textContent = user.email;
            document.getElementById('profileMajor').textContent = user.major || '未设置';
            document.getElementById('profileGrade').textContent = user.grade || '未设置';
            
            const avatarBtn = document.getElementById('profileAvatar');
            
            if (user.avatar && user.avatar.startsWith('/static/avatars/')) {
                if (avatarBtn) {
                    avatarBtn.style.backgroundImage = `url(${user.avatar})`;
                    avatarBtn.style.backgroundSize = 'cover';
                    avatarBtn.style.backgroundPosition = 'center';
                    avatarBtn.textContent = '';
                }
            } else {
                if (avatarBtn) {
                    avatarBtn.style.backgroundImage = 'none';
                    avatarBtn.textContent = user.username.charAt(0).toUpperCase();
                }
            }
        }

        function editProfile() {
            const user = getCurrentUser();
            if (!user) return;

            document.getElementById('editUsername').value = user.username;
            document.getElementById('editEmail').value = user.email;
            document.getElementById('editMajor').value = user.major || '';
            document.getElementById('editGrade').value = user.grade || '';

            document.getElementById('editModal').style.display = 'block';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        function changePassword() {
            document.getElementById('passwordModal').style.display = 'block';
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').style.display = 'none';
        }
        // 编辑资料表单提交
        document.getElementById('editForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const user = getCurrentUser();
            if (!user) return;

            const formData = new FormData();
            formData.append('user_id', user.id);
            formData.append('username', document.getElementById('editUsername').value);
            formData.append('email', document.getElementById('editEmail').value);
            formData.append('major', document.getElementById('editMajor').value);
            formData.append('grade', document.getElementById('editGrade').value);

            try {
                const response = await fetch('/api/user/profile', {
                    method: 'PUT',
                    body: formData
                });
                
                const result = await response.json();
                if (result.code === 200) {
                    // 更新本地存储的用户信息
                    const updatedUser = { 
                        ...user, 
                        username: document.getElementById('editUsername').value,
                        email: document.getElementById('editEmail').value,
                        major: document.getElementById('editMajor').value,
                        grade: document.getElementById('editGrade').value
                    };
                    localStorage.setItem('user', JSON.stringify(updatedUser));
                    
                    // 清除全局缓存，强制重新加载
                    globalCache.userInfo = null;
                    // 重新加载用户信息
                    loadUserInfo();
                    closeEditModal();
                    alert('资料更新成功');
                } else {
                    alert('更新失败: ' + result.msg);
                }
            } catch (error) {
                alert('网络错误，请稍后重试');
            }
        });

        // 更改头像
        function changeAvatar() {
            document.getElementById('avatarInput').click();
        }

        // 头像文件选择处理
        document.getElementById('avatarInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const user = getCurrentUser();
            if (!user) return;

            const formData = new FormData();
            formData.append('user_id', user.id);
            formData.append('avatar', file);

            try {
                const response = await fetch('/api/user/profile', {
                    method: 'PUT',
                    body: formData
                });
                
                const result = await response.json();
                if (result.code === 200) {
                    // 更新本地存储的用户信息
                    const updatedUser = { ...user, avatar: result.data.avatar };
                    localStorage.setItem('user', JSON.stringify(updatedUser));
                    
                    // 清除全局缓存，强制重新加载
                    globalCache.userInfo = null;
                    
                    // 直接更新导航栏的头像
                    const navAvatar = document.getElementById('navAvatar');
                    if (navAvatar) {
                        if (updatedUser.avatar && updatedUser.avatar.startsWith('/static/avatars/')) {
                            // 添加随机参数避免浏览器缓存
                            const avatarUrl = `${updatedUser.avatar}?t=${Date.now()}`;
                            navAvatar.style.backgroundImage = `url(${avatarUrl})`;
                            navAvatar.style.backgroundSize = 'cover';
                            navAvatar.style.backgroundPosition = 'center';
                            navAvatar.textContent = '';
                        } else {
                            navAvatar.style.backgroundImage = 'none';
                            navAvatar.textContent = updatedUser.username.charAt(0).toUpperCase();
                        }
                    }
                    
                    // 重新加载用户信息，更新个人中心页面的头像
                    loadUserInfo();
                    
                    alert('头像更新成功');
                } else {
                    alert('更新失败: ' + result.msg);
                }
            } catch (error) {
                alert('网络错误，请稍后重试');
            }
        });

        // 修改密码表单提交
        document.getElementById('passwordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                alert('两次输入的密码不一致');
                return;
            }

            try {
                const response = await fetch('/api/auth/password/change', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        old_password: oldPassword,
                        new_password: newPassword
                    })
                });
                
                const result = await response.json();
                if (result.code === 200) {
                    closePasswordModal();
                    alert('密码修改成功');
                } else {
                    alert('修改失败: ' + result.msg);
                }
            } catch (error) {
                alert('网络错误，请稍后重试');
            }
        });
        // 点击模态框外部关闭
        window.onclick = function(event) {
            const editModal = document.getElementById('editModal');
            const passwordModal = document.getElementById('passwordModal');
            
            if (event.target === editModal) {
                editModal.style.display = 'none';
            }
            if (event.target === passwordModal) {
                passwordModal.style.display = 'none';
            }
        }
    </script>
</body>
</html>
