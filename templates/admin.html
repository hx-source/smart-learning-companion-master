<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员后台 - 智学伴</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script defer src="/static/js/shared.js?v=fix-text-20260612"></script>
    <style>
        .admin-page { max-width: 1180px; margin: 24px auto; padding: 0 20px; }
        .admin-grid { display: grid; grid-template-columns: 340px 1fr; gap: 20px; align-items: start; }
        .admin-panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 18px; box-shadow: 0 8px 24px rgba(15, 23, 42, .06); }
        .admin-panel h2 { margin: 0 0 14px; font-size: 18px; color: #111827; }
        .admin-form { display: grid; gap: 12px; }
        .admin-form label { display: grid; gap: 6px; font-size: 13px; color: #374151; }
        .admin-form input, .admin-form select { height: 38px; border: 1px solid #d1d5db; border-radius: 6px; padding: 0 10px; }
        .admin-form textarea { min-height: 64px; border: 1px solid #d1d5db; border-radius: 6px; padding: 8px 10px; resize: vertical; }
        .admin-actions { display: flex; gap: 8px; align-items: center; }
        .admin-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .admin-table th, .admin-table td { border-bottom: 1px solid #eef2f7; padding: 10px 8px; text-align: left; }
        .admin-table th { color: #4b5563; background: #f9fafb; }
        .admin-table select { height: 32px; border: 1px solid #d1d5db; border-radius: 6px; }
        .admin-btn { height: 36px; border: 0; border-radius: 6px; padding: 0 12px; cursor: pointer; background: #2563eb; color: #fff; }
        .admin-btn.secondary { background: #eef2ff; color: #1d4ed8; }
        .admin-btn.danger { background: #dc2626; }
        .admin-status { min-height: 22px; margin: 12px 0; color: #374151; }
        @media (max-width: 860px) { .admin-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    {% include 'components/navbar.html' %}
    <main class="admin-page">
        <h1 class="page-title">管理员后台</h1>
        <div class="admin-grid">
            <section class="admin-panel">
                <h2>创建用户</h2>
                <form class="admin-form" id="createUserForm">
                    <label>用户名<input id="newUsername" required minlength="3"></label>
                    <label>邮箱<input id="newEmail" type="email"></label>
                    <label>初始密码<input id="newPassword" type="password" required placeholder="8-20位，含大小写和数字"></label>
                    <label>角色
                        <select id="newRole">
                            <option value="student">学生</option>
                            <option value="teacher">教师</option>
                            <option value="admin">管理员</option>
                        </select>
                    </label>
                    <button class="admin-btn" type="submit">创建</button>
                </form>
                <div class="admin-status" id="adminStatus"></div>
            </section>

            <section class="admin-panel">
                <div class="admin-actions">
                    <h2 style="flex: 1;">用户与权限</h2>
                    <button class="admin-btn secondary" onclick="loadAdminData()">刷新</button>
                </div>
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>用户名</th>
                            <th>邮箱</th>
                            <th>角色</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody"></tbody>
                </table>
            </section>
        </div>

        <section class="admin-panel" style="margin-top: 20px;">
            <div class="admin-actions">
                <h2 style="flex: 1;">班级管理</h2>
                <button class="admin-btn secondary" onclick="loadAdminData()">刷新班级</button>
            </div>
            <form class="admin-form" id="createClassForm" style="grid-template-columns: 1fr 1fr 1fr auto; align-items: end; margin-bottom: 16px;">
                <label>班级名称<input id="newClassName" required placeholder="例如：人工智能230582班"></label>
                <label>负责教师<select id="newClassTeacher"></select></label>
                <label>说明<input id="newClassDescription" placeholder="可选"></label>
                <button class="admin-btn" type="submit">创建班级</button>
            </form>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>班级</th>
                        <th>教师</th>
                        <th>成员</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="classTableBody"></tbody>
            </table>
        </section>

        <section class="admin-panel" style="margin-top: 20px;">
            <h2>班级知识库</h2>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>班级</th>
                        <th>知识库</th>
                        <th>教师</th>
                        <th>创建时间</th>
                    </tr>
                </thead>
                <tbody id="classKbTableBody"></tbody>
            </table>
        </section>
    </main>

    <script>
        const roleLabels = { student: '学生', teacher: '教师', admin: '管理员' };
        let adminUsers = [];
        let adminClasses = [];
        let classMembers = {};

        function adminHeaders(json = true) {
            const headers = { Authorization: `Bearer ${localStorage.getItem('token') || getCookie('token')}` };
            if (json) headers['Content-Type'] = 'application/json';
            return headers;
        }

        function setAdminStatus(message) {
            document.getElementById('adminStatus').textContent = message || '';
        }

        async function loadAdminData() {
            const [usersRes, classesRes, classKbRes] = await Promise.all([
                fetch('/api/admin/users', { headers: adminHeaders(false) }),
                fetch('/api/classes', { headers: adminHeaders(false) }),
                fetch('/api/admin/class-knowledge-bases', { headers: adminHeaders(false) })
            ]);
            const usersData = await usersRes.json();
            const classesData = await classesRes.json();
            const classKbData = await classKbRes.json();
            adminUsers = usersData.data || [];
            adminClasses = classesData.data || [];

            await Promise.all(adminClasses.map(async item => {
                const res = await fetch(`/api/classes/${item.id}/members`, { headers: adminHeaders(false) });
                const data = await res.json();
                classMembers[item.id] = data.data || [];
            }));

            const usersBody = document.getElementById('usersTableBody');
            usersBody.innerHTML = adminUsers.map(user => `
                <tr>
                    <td>${user.id}</td>
                    <td>${escapeHtml(user.username || '')}</td>
                    <td>${escapeHtml(user.email || '')}</td>
                    <td>
                        <select onchange="updateUserRole(${user.id}, this.value)">
                            ${Object.keys(roleLabels).map(role => `<option value="${role}" ${user.role === role ? 'selected' : ''}>${roleLabels[role]}</option>`).join('')}
                        </select>
                    </td>
                    <td><button class="admin-btn danger" onclick="deleteUser(${user.id})">删除</button></td>
                </tr>
            `).join('');

            renderTeacherOptions();
            renderClasses();

            const classBody = document.getElementById('classKbTableBody');
            classBody.innerHTML = (classKbData.data || []).map(item => `
                <tr>
                    <td>${escapeHtml(item.class_name || '')}</td>
                    <td>${escapeHtml(item.knowledge_base || '')}</td>
                    <td>${escapeHtml(item.teacher_name || '')}</td>
                    <td>${escapeHtml(item.created_at || '')}</td>
                </tr>
            `).join('');
        }

        function renderTeacherOptions() {
            const select = document.getElementById('newClassTeacher');
            if (!select) return;
            const teachers = adminUsers.filter(user => ['teacher', 'admin'].includes(user.role));
            select.innerHTML = teachers.map(user => `<option value="${user.id}">${escapeHtml(user.username)}（${roleLabels[user.role]}）</option>`).join('');
        }

        function renderClasses() {
            const body = document.getElementById('classTableBody');
            const students = adminUsers.filter(user => user.role === 'student');
            body.innerHTML = adminClasses.map(item => {
                const members = classMembers[item.id] || [];
                const memberNames = members.map(member => escapeHtml(member.student_name || '')).join('、') || '暂无学生';
                const memberIds = new Set(members.map(member => member.student_id));
                const studentOptions = students
                    .filter(student => !memberIds.has(student.id))
                    .map(student => `<option value="${student.id}">${escapeHtml(student.username)}</option>`)
                    .join('');
                return `
                    <tr>
                        <td>${item.id}</td>
                        <td>${escapeHtml(item.name || '')}</td>
                        <td>${escapeHtml(item.teacher_name || '')}</td>
                        <td>
                            <div style="margin-bottom: 8px;">${memberNames}</div>
                            <div class="admin-actions">
                                <select id="studentSelect_${item.id}">${studentOptions || '<option value="">无可添加学生</option>'}</select>
                                <button class="admin-btn secondary" onclick="addClassMember(${item.id})">添加学生</button>
                            </div>
                            <div style="margin-top: 8px;">
                                ${members.map(member => `<button class="admin-btn danger" style="height:28px;margin:2px;" onclick="removeClassMember(${item.id}, ${member.student_id})">${escapeHtml(member.student_name || '')} ×</button>`).join('')}
                            </div>
                        </td>
                        <td>${escapeHtml(item.created_at || '')}</td>
                        <td><button class="admin-btn danger" onclick="deleteClassRoom(${item.id})">删除班级</button></td>
                    </tr>
                `;
            }).join('');
        }

        async function updateUserRole(userId, role) {
            const res = await fetch(`/api/admin/users/${userId}`, {
                method: 'PUT',
                headers: adminHeaders(),
                body: JSON.stringify({ role })
            });
            const data = await res.json();
            setAdminStatus(data.code === 200 ? '角色已更新' : (data.msg || data.error || '更新失败'));
            loadAdminData();
        }

        async function deleteUser(userId) {
            if (!confirm('确定删除这个用户吗？')) return;
            const res = await fetch(`/api/admin/users/${userId}`, {
                method: 'DELETE',
                headers: adminHeaders(false)
            });
            const data = await res.json();
            setAdminStatus(data.code === 200 ? '用户已删除' : (data.msg || data.error || '删除失败'));
            loadAdminData();
        }

        document.getElementById('createUserForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const payload = {
                username: document.getElementById('newUsername').value.trim(),
                email: document.getElementById('newEmail').value.trim(),
                password: document.getElementById('newPassword').value,
                role: document.getElementById('newRole').value
            };
            const res = await fetch('/api/admin/users', {
                method: 'POST',
                headers: adminHeaders(),
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.code === 200) {
                event.target.reset();
                setAdminStatus('用户已创建');
                loadAdminData();
            } else {
                setAdminStatus(data.msg || data.error || '创建失败');
            }
        });

        document.getElementById('createClassForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const payload = {
                name: document.getElementById('newClassName').value.trim(),
                teacher_id: Number(document.getElementById('newClassTeacher').value),
                description: document.getElementById('newClassDescription').value.trim()
            };
            const res = await fetch('/api/classes', {
                method: 'POST',
                headers: adminHeaders(),
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.code === 200) {
                event.target.reset();
                setAdminStatus('班级已创建');
                loadAdminData();
            } else {
                setAdminStatus(data.msg || data.error || '班级创建失败');
            }
        });

        async function addClassMember(classId) {
            const select = document.getElementById(`studentSelect_${classId}`);
            const studentId = Number(select?.value);
            if (!studentId) return;
            const res = await fetch(`/api/classes/${classId}/members`, {
                method: 'POST',
                headers: adminHeaders(),
                body: JSON.stringify({ student_id: studentId })
            });
            const data = await res.json();
            setAdminStatus(data.code === 200 ? '学生已加入班级' : (data.msg || data.error || '添加失败'));
            loadAdminData();
        }

        async function removeClassMember(classId, studentId) {
            const res = await fetch(`/api/classes/${classId}/members/${studentId}`, {
                method: 'DELETE',
                headers: adminHeaders(false)
            });
            const data = await res.json();
            setAdminStatus(data.code === 200 ? '学生已移出班级' : (data.msg || data.error || '移除失败'));
            loadAdminData();
        }

        async function deleteClassRoom(classId) {
            if (!confirm('确定删除这个班级吗？关联的班级知识库也会被删除。')) return;
            const res = await fetch(`/api/classes/${classId}`, {
                method: 'DELETE',
                headers: adminHeaders(false)
            });
            const data = await res.json();
            setAdminStatus(data.code === 200 ? '班级已删除' : (data.msg || data.error || '删除失败'));
            loadAdminData();
        }

        document.addEventListener('DOMContentLoaded', loadAdminData);
    </script>
</body>
</html>
