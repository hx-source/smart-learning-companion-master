<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库 - 智学伴</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- 预加载关键资源 -->
    <link rel="preload" href="/static/js/shared.js" as="script">
    <link rel="preload" href="/static/css/style.css" as="style">
</head>
<body>
    <!-- 导航栏 -->
    {% include 'components/navbar.html' %}

    <!-- 主内容 -->
    <div class="main-wrapper">
        <main class="knowledge-page">
            <h1 class="page-title">知识库管理</h1>
            
            <!-- 知识库选择器 -->
            <div class="knowledge-base-selector">
                <label for="knowledgeBaseSelect">选择知识库：</label>
                <select id="knowledgeBaseSelect" onchange="switchKnowledgeBase()">
                    <option value="default">默认知识库</option>
                </select>
                <button class="btn-primary small" onclick="createKnowledgeBase()">创建知识库</button>
            </div>

            <!-- 统计信息卡片 -->
            <div class="stats-cards">
                <div class="stat-card">
                    <div class="stat-icon">📄</div>
                    <div class="stat-info">
                        <div class="stat-value" id="totalDocuments">-</div>
                        <div class="stat-label">文档数量</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🧩</div>
                    <div class="stat-info">
                        <div class="stat-value" id="totalVectors">-</div>
                        <div class="stat-label">向量数量</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📊</div>
                    <div class="stat-info">
                        <div class="stat-value" id="vectorDimension">-</div>
                        <div class="stat-label">向量维度</div>
                    </div>
                </div>
            </div>

            <!-- 文件上传区域 -->
            <div class="upload-section">
                <div class="section-header">
                    <h3>📤 上传文档</h3>
                    <p class="section-desc">支持 PDF、TXT、DOCX 格式，文件将自动解析并添加到知识库</p>
                </div>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📁</div>
                    <div class="upload-text">
                        <p>拖拽文件到此处，或 <span class="upload-link">点击上传</span></p>
                        <p class="upload-hint">支持 PDF、TXT、DOCX 格式，单个文件最大 100MB</p>
                    </div>
                    <input type="file" id="fileInput" accept=".pdf,.txt,.docx" multiple style="display: none;">
                </div>
                <div class="upload-progress" id="uploadProgress" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <span class="progress-text" id="progressText">0%</span>
                </div>
                <div class="upload-status" id="uploadStatus"></div>
            </div>



            <!-- 文件分类管理 -->
            <div class="sources-section">
                <div class="section-header">
                    <h3>📁 文件来源管理</h3>
                    <p class="section-desc">按文件来源分类管理向量数据</p>
                </div>
                <div class="sources-filter">
                    <input type="text" id="sourceFilter" placeholder="搜索文件名..." oninput="filterSources()">
                </div>
                <div class="sources-list" id="sourcesList">
                    <div class="loading">
                        <div class="loading-dots"><span></span><span></span><span></span></div>
                        <div>加载中...</div>
                    </div>
                </div>
            </div>

            <!-- 向量列表 -->
            <div class="vectors-section">
                <div class="section-header">
                    <h3>🧩 向量列表</h3>
                    <p class="section-desc">显示知识库中的所有向量信息</p>
                </div>
                <div class="vectors-list" id="vectorsList">
                    <div class="loading">
                        <div class="loading-dots"><span></span><span></span><span></span></div>
                        <div>加载中...</div>
                    </div>
                </div>
                <div class="vectors-pagination" id="vectorsPagination">
                    <!-- 动态生成 -->
                </div>
            </div>
        </main>
    </div>

    <script>
        // 全局变量
        let currentPage = 1;
        const pageSize = 10;
        let currentKnowledgeBase = 'default';

        // 获取cookie
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            loadKnowledgeBases();
            loadStats();
            loadSources();
            initUploadArea();
            
            // 实现向量列表的懒加载
            initLazyLoading();
        });
        
        // 加载所有知识库列表
        async function loadKnowledgeBases() {
            try {
                const token = localStorage.getItem('token') || getCookie('token');
                const response = await fetch('/api/knowledge-base/list', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                const data = await response.json();
                
                if (data.code === 200) {
                    const select = document.getElementById('knowledgeBaseSelect');
                    if (select) {
                        // 清空现有选项
                        select.innerHTML = '';
                        
                        // 添加所有知识库选项
                        data.data.forEach(kb => {
                            const option = document.createElement('option');
                            option.value = kb;
                            option.textContent = kb;
                            if (kb === currentKnowledgeBase) {
                                option.selected = true;
                            }
                            select.appendChild(option);
                        });
                    }
                }
            } catch (error) {
                console.error('加载知识库列表失败:', error);
            }
        }
        
        // 切换知识库
        function switchKnowledgeBase() {
            const select = document.getElementById('knowledgeBaseSelect');
            if (select) {
                currentKnowledgeBase = select.value;
                // 重新加载数据
                loadStats();
                loadSources();
                loadVectors();
            }
        }
        
        // 创建知识库
        function createKnowledgeBase() {
            const name = prompt('请输入知识库名称:');
            if (name && name.trim()) {
                // 验证知识库名称
                if (name.includes('/') || name.includes('\\') || name.includes('.')) {
                    alert('知识库名称不能包含斜杠或点号');
                    return;
                }
                
                // 初始化新知识库
                try {
                    const token = localStorage.getItem('token') || getCookie('token');
                    // 发送请求到服务器，创建新知识库
                    // 这里我们通过上传一个空文件来触发知识库的创建
                    const formData = new FormData();
                    // 创建一个空文件
                    const emptyFile = new Blob([''], { type: 'text/plain' });
                    formData.append('file', emptyFile, 'empty.txt');
                    formData.append('knowledge_base', name);
                    
                    fetch('/api/knowledge-base/upload', {
                        method: 'POST',
                        body: formData,
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    }).then(response => response.json()).then(data => {
                        if (data.code === 200) {
                            // 重新加载知识库列表
                            loadKnowledgeBases();
                            // 选择新创建的知识库
                            setTimeout(() => {
                                const select = document.getElementById('knowledgeBaseSelect');
                                if (select) {
                                    select.value = name;
                                    switchKnowledgeBase();
                                }
                            }, 100);
                        } else {
                            alert('创建知识库失败: ' + data.msg);
                        }
                    });
                } catch (error) {
                    console.error('创建知识库失败:', error);
                    alert('创建知识库失败: ' + error.message);
                }
            }
        }
        
        // 初始化懒加载
        function initLazyLoading() {
            const vectorsSection = document.querySelector('.vectors-section');
            if (!vectorsSection) return;
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        // 当向量列表区域进入视口时，加载数据
                        loadVectors();
                        // 只加载一次
                        observer.disconnect();
                    }
                });
            }, {
                threshold: 0.1
            });
            
            observer.observe(vectorsSection);
        }
        
        // 加载文件来源列表
        async function loadSources() {
            const sourcesList = document.getElementById('sourcesList');
            if (!sourcesList) return;
            
            try {
                sourcesList.innerHTML = `
                    <div class="loading">
                        <div class="loading-dots"><span></span><span></span><span></span></div>
                        <div>加载中...</div>
                    </div>
                `;
                
                const token = localStorage.getItem('token') || getCookie('token');
                const response = await fetch(`/api/knowledge-base/sources?knowledge_base=${encodeURIComponent(currentKnowledgeBase)}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                const data = await response.json();
                
                if (data.code === 200) {
                    displaySources(data.data);
                } else {
                    sourcesList.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">❌</div>
                            <div>加载文件来源失败: ${data.msg}</div>
                        </div>
                    `;
                }
            } catch (error) {
                sourcesList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">❌</div>
                        <div>加载文件来源出错: ${error.message}</div>
                    </div>
                `;
            }
        }
        
        // 显示文件来源列表
        function displaySources(sources) {
            const sourcesList = document.getElementById('sourcesList');
            if (!sourcesList) return;
            
            if (!sources || sources.length === 0) {
                sourcesList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📁</div>
                        <div>暂无文件来源</div>
                    </div>
                `;
                return;
            }
            
            // 清空容器
            sourcesList.innerHTML = '';
            
            // 为每个来源创建元素
            sources.forEach(source => {
                const sourceItem = document.createElement('div');
                sourceItem.className = 'source-item';
                
                sourceItem.innerHTML = `
                    <div class="source-info">
                        <div class="source-name">${source.file_name}</div>
                        <div class="source-stats">
                            <span class="vector-count">${source.vector_count} 个向量</span>
                            <span class="source-path">${source.file_path}</span>
                        </div>
                    </div>
                    <div class="source-actions">
                        <button class="btn-secondary small">查看向量</button>
                        <button class="btn-danger small">删除</button>
                    </div>
                `;
                
                // 添加事件监听器
                const viewBtn = sourceItem.querySelector('.btn-secondary');
                const deleteBtn = sourceItem.querySelector('.btn-danger');
                
                viewBtn.addEventListener('click', () => viewSourceVectors(source.file_path));
                deleteBtn.addEventListener('click', () => deleteSource(source.file_path));
                
                sourcesList.appendChild(sourceItem);
            });
        }
        
        // 按文件名筛选文件来源
        function filterSources() {
            const filter = document.getElementById('sourceFilter').value.toLowerCase();
            const sourceItems = document.querySelectorAll('.source-item');
            
            sourceItems.forEach(item => {
                const fileName = item.querySelector('.source-name').textContent.toLowerCase();
                const filePath = item.querySelector('.source-path').textContent.toLowerCase();
                
                if (fileName.includes(filter) || filePath.includes(filter)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }
        
        // 查看文件来源的向量
        function viewSourceVectors(filePath) {
            // 编码文件路径
            const encodedPath = encodeURIComponent(filePath);
            // 加载该文件的向量数据
            loadVectors(1, 10, encodedPath);
        }
        
        // 删除文件来源
        function deleteSource(filePath) {
            if (!confirm(`确定要删除文件 "${filePath}" 的所有向量数据吗？此操作不可恢复！`)) {
                return;
            }
            
            // 编码文件路径
            const encodedPath = encodeURIComponent(filePath);
            
            try {
                const token = localStorage.getItem('token') || getCookie('token');
                fetch(`/api/knowledge-base/sources/${encodedPath}?knowledge_base=${encodeURIComponent(currentKnowledgeBase)}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200) {
                        showStatus(`成功删除 ${data.data.deleted_count} 个向量`, 'success');
                        // 重新加载文件来源列表和统计信息
                        loadSources();
                        loadStats();
                        // 重新加载向量列表（清空当前筛选）
                        loadVectors();
                    } else {
                        showStatus(`删除失败: ${data.msg}`, 'error');
                    }
                })
                .catch(error => {
                    showStatus(`删除出错: ${error.message}`, 'error');
                });
            } catch (error) {
                showStatus(`删除出错: ${error.message}`, 'error');
            }
        }
        
        // 保存当前的source参数
        let currentSource = null;
        
        // 修改loadVectors函数，支持按来源筛选
        async function loadVectors(page = 1, pageSize = 10, source = null) {
            const vectorsList = document.getElementById('vectorsList');
            const vectorsPagination = document.getElementById('vectorsPagination');
            
            // 保存当前的source
            currentSource = source;
            
            try {
                // 显示加载状态
                vectorsList.innerHTML = `
                    <div class="loading">
                        <div class="loading-dots"><span></span><span></span><span></span></div>
                        <div>加载中...</div>
                    </div>
                `;
                
                const token = localStorage.getItem('token') || getCookie('token');
                let url = `/api/knowledge-base/vectors?page=${page}&page_size=${pageSize}&knowledge_base=${encodeURIComponent(currentKnowledgeBase)}`;
                if (source) {
                    url += `&source=${source}`;
                }
                
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                const data = await response.json();
                
                if (data.code === 200) {
                    displayVectors(data.data, source);
                    displayPagination(data.data, page, pageSize, source);
                } else {
                    vectorsList.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">❌</div>
                            <div>加载向量失败: ${data.msg}</div>
                        </div>
                    `;
                    vectorsPagination.innerHTML = '';
                }
            } catch (error) {
                vectorsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">❌</div>
                        <div>加载向量出错: ${error.message}</div>
                    </div>
                `;
                vectorsPagination.innerHTML = '';
            }
        }
        
        // 查看全部向量
        function viewAllVectors() {
            loadVectors(1, 10, null);
        }
        
        // 修改displayPagination函数，支持传递source参数
        function displayPagination(data, currentPage, pageSize, source = null) {
            const vectorsPagination = document.getElementById('vectorsPagination');
            const totalPages = Math.ceil(data.total / pageSize);
            
            if (totalPages <= 1) {
                vectorsPagination.innerHTML = '';
                return;
            }
            
            let paginationHTML = `
                <div class="pagination">
                    <button class="pagination-btn ${currentPage === 1 ? 'disabled' : ''}" onclick="loadVectors(${currentPage - 1}, ${pageSize}, ${source ? `'${source}'` : 'null'})">&laquo;</button>
            `;
            
            // 显示页码
            for (let i = 1; i <= totalPages; i++) {
                if (i <= 3 || i >= totalPages - 2 || (i >= currentPage - 1 && i <= currentPage + 1)) {
                    paginationHTML += `
                        <button class="pagination-btn ${i === currentPage ? 'active' : ''}" onclick="loadVectors(${i}, ${pageSize}, ${source ? `'${source}'` : 'null'})"><span>${i}</span></button>
                    `;
                } else if (i === 4 || i === totalPages - 3) {
                    paginationHTML += `<span class="pagination-ellipsis">...</span>`;
                }
            }
            
            paginationHTML += `
                    <button class="pagination-btn ${currentPage === totalPages ? 'disabled' : ''}" onclick="loadVectors(${currentPage + 1}, ${pageSize}, ${source ? `'${source}'` : 'null'})">&raquo;</button>
                </div>
            `;
            
            vectorsPagination.innerHTML = paginationHTML;
        }

        // 加载统计信息
        async function loadStats() {
            try {
                const token = localStorage.getItem('token') || getCookie('token');
                const response = await fetch(`/api/knowledge-base/stats?knowledge_base=${encodeURIComponent(currentKnowledgeBase)}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                const data = await response.json();

                if (data.code === 200) {
                    document.getElementById('totalDocuments').textContent = data.data.total_documents;
                    document.getElementById('totalVectors').textContent = data.data.total_vectors;
                    document.getElementById('vectorDimension').textContent = data.data.vector_dimension;
                }
            } catch (error) {
                console.error('加载统计信息失败:', error);
            }
        }

        // 刷新统计
        function refreshStats() {
            loadStats();
            showStatus('统计信息已刷新', 'success');
        }

        // 初始化上传区域
        function initUploadArea() {
            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('fileInput');

            // 防止重复初始化
            if (uploadArea.dataset.initialized) return;
            uploadArea.dataset.initialized = 'true';

            // 点击上传
            uploadArea.addEventListener('click', (e) => {
                // 阻止事件冒泡，防止多次触发
                e.stopPropagation();
                fileInput.click();
            });

            // 文件选择
            fileInput.addEventListener('change', (e) => {
                // 阻止事件冒泡，防止多次触发
                e.stopPropagation();
                if (e.target.files.length > 0) {
                    handleFiles(e.target.files);
                }
            });

            // 拖拽上传
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });

            uploadArea.addEventListener('dragleave', () => {
                uploadArea.classList.remove('dragover');
            });

            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                if (e.dataTransfer.files.length > 0) {
                    handleFiles(e.dataTransfer.files);
                }
            });
        }

        // 处理文件上传
        async function handleFiles(files) {
            const uploadProgress = document.getElementById('uploadProgress');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            const fileInput = document.getElementById('fileInput');

            // 检查是否有文件
            if (files.length === 0) return;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];

                // 检查文件类型
                const allowedExtensions = ['.pdf', '.txt', '.docx'];
                const fileExt = file.name.substring(file.name.lastIndexOf('.')).toLowerCase();

                if (!allowedExtensions.includes(fileExt)) {
                    showStatus(`不支持的文件格式: ${file.name}`, 'error');
                    continue;
                }

                // 显示进度条
                uploadProgress.style.display = 'flex';
                updateProgress(0);

                const formData = new FormData();
                formData.append('file', file);
                formData.append('knowledge_base', currentKnowledgeBase);

                try {
                    updateProgress(30);
                    const token = localStorage.getItem('token') || getCookie('token');
                    const response = await fetch('/api/knowledge-base/upload', {
                        method: 'POST',
                        body: formData,
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    updateProgress(70);

                    const data = await response.json();
                    updateProgress(100);

                    if (data.code === 200) {
                        showStatus(`✅ ${file.name} 上传成功`, 'success');
                        loadStats(); // 刷新统计
                        loadSources(); // 刷新文件来源列表
                        loadVectors(); // 刷新向量列表
                    } else {
                        showStatus(`❌ ${file.name} 上传失败: ${data.msg}`, 'error');
                    }
                } catch (error) {
                    showStatus(`❌ ${file.name} 上传出错: ${error.message}`, 'error');
                } finally {
                    // 延迟隐藏进度条
                    setTimeout(() => {
                        uploadProgress.style.display = 'none';
                    }, 1000);
                }
            }
            
            // 重置文件输入框，允许再次选择同一文件
            fileInput.value = '';
        }

        // 更新进度条
        function updateProgress(percent) {
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressText').textContent = percent + '%';
        }

        // 显示向量列表
        function displayVectors(data, source) {
            const vectorsList = document.getElementById('vectorsList');

            if (!data || !data.items || data.items.length === 0) {
                vectorsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🧩</div>
                        <div>暂无向量数据</div>
                    </div>
                `;
                return;
            }

            // 构建向量列表
            let vectorsHTML = '';
            
            // 如果有source参数，添加"查看全部向量"按钮
            if (source) {
                vectorsHTML = `
                    <div class="view-all-vectors">
                        <button class="btn-secondary small" onclick="viewAllVectors()">查看全部向量</button>
                    </div>
                `;
            }
            
            vectorsHTML += data.items.map((vector, index) => {
                const content = vector.content || '';
                const truncatedContent = content.length > 100 ? content.substring(0, 100) + '...' : content;
                return `
                    <div class="vector-item">
                        <div class="vector-header">
                            <span class="vector-index">#${(data.page - 1) * data.page_size + index + 1}</span>
                            <span class="vector-source">${vector.source || '未知来源'}</span>
                        </div>
                        <div class="vector-content">
                            ${truncatedContent}
                        </div>
                        <div class="vector-meta">
                            <span class="vector-chunk">片段: ${vector.chunk_index || 0}</span>
                            <button class="btn-small" data-vector='${JSON.stringify(vector).replace(/'/g, "&#39;")}'><</button>
                        </div>
                    </div>
                `;
            }).join('');
            
            vectorsList.innerHTML = vectorsHTML;
            
            // 添加事件监听器
            document.querySelectorAll('.vector-item .btn-small').forEach(button => {
                button.addEventListener('click', function() {
                    const vector = JSON.parse(this.getAttribute('data-vector'));
                    showVectorDetails(vector);
                });
            });
        }

        // 显示向量详情
        function showVectorDetails(vector) {
            const content = vector.content || '';
            const metadata = vector.metadata || {};
            
            let detailsHTML = `
                <div class="vector-details">
                    <h4>向量详情</h4>
                    <div class="detail-item">
                        <label>来源:</label>
                        <span>${vector.source || '未知来源'}</span>
                    </div>
                    <div class="detail-item">
                        <label>片段索引:</label>
                        <span>${vector.chunk_index || 0}</span>
                    </div>
                    <div class="detail-item">
                        <label>内容:</label>
                        <div class="detail-content">${content}</div>
                    </div>
                    <div class="detail-item">
                        <label>元数据:</label>
                        <div class="detail-content">${JSON.stringify(metadata, null, 2)}</div>
                    </div>
                </div>
            `;

            // 创建模态框
            const modal = document.createElement('div');
            modal.className = 'modal active';
            modal.innerHTML = `
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>向量详情</h3>
                        <button class="modal-close" onclick="this.closest('.modal').remove()">&times;</button>
                    </div>
                    <div class="modal-body">
                        ${detailsHTML}
                    </div>
                    <div class="modal-footer">
                        <button class="btn-secondary" onclick="this.closest('.modal').remove()">关闭</button>
                    </div>
                </div>
            `;

            document.body.appendChild(modal);
        }

        // 显示状态消息
        function showStatus(message, type = 'info') {
            const uploadStatus = document.getElementById('uploadStatus');
            if (!uploadStatus) return;

            uploadStatus.innerHTML = `
                <div class="status-message ${type}">
                    ${message}
                </div>
            `;

            // 3秒后自动隐藏
            setTimeout(() => {
                uploadStatus.innerHTML = '';
            }, 3000);
        }
    </script>
    <script src="/static/js/shared.js"></script>
</body>
</html>
