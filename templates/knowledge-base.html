<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库 - 智学伴</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .kb-shell {
            display: grid;
            grid-template-columns: minmax(260px, 340px) minmax(0, 1fr);
            gap: 18px;
            align-items: start;
        }
        .kb-sidebar, .kb-detail {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        }
        .kb-sidebar {
            padding: 16px;
            position: sticky;
            top: 84px;
        }
        .kb-sidebar-head, .kb-detail-head {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            margin-bottom: 14px;
        }
        .kb-sidebar-head h2, .kb-detail-head h2 {
            font-size: 18px;
            margin: 0;
        }
        .kb-create-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        .kb-list {
            display: grid;
            gap: 8px;
        }
        .kb-item {
            width: 100%;
            border: 1px solid #e5e7eb;
            background: #f9fafb;
            border-radius: 8px;
            padding: 10px 12px;
            text-align: left;
            cursor: pointer;
            display: grid;
            gap: 6px;
        }
        .kb-item.active {
            border-color: #4a6cf7;
            background: #eef2ff;
        }
        .kb-item-title {
            font-weight: 700;
            color: #111827;
            word-break: break-word;
        }
        .kb-item-meta {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            font-size: 12px;
            color: #6b7280;
        }
        .kb-tag {
            padding: 2px 7px;
            border-radius: 999px;
            background: #e5e7eb;
            color: #374151;
        }
        .kb-tag.class { background: #e0f2fe; color: #0369a1; }
        .kb-tag.personal { background: #dcfce7; color: #166534; }
        .kb-tag.readonly { background: #fee2e2; color: #991b1b; }
        .kb-detail {
            min-height: 520px;
            padding: 20px;
        }
        .kb-detail-sub {
            color: #6b7280;
            margin: -6px 0 0;
            font-size: 13px;
        }
        .kb-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .kb-empty-panel {
            display: grid;
            place-items: center;
            min-height: 420px;
            text-align: center;
            color: #4b5563;
        }
        .kb-empty-panel h2 {
            color: #111827;
            margin-bottom: 8px;
        }
        .kb-upload-box {
            border: 1px dashed #c7d2fe;
            border-radius: 12px;
            background: #f8fafc;
            padding: 18px;
            margin: 18px 0;
        }
        .kb-upload-title {
            font-weight: 700;
            margin-bottom: 8px;
        }
        .kb-upload-area {
            border: 1px dashed #9ca3af;
            border-radius: 10px;
            padding: 28px 16px;
            text-align: center;
            background: #fff;
            cursor: pointer;
        }
        .kb-upload-area.dragover {
            border-color: #4a6cf7;
            background: #eef2ff;
        }
        .kb-file-list {
            display: grid;
            gap: 10px;
        }
        .kb-file-item {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 12px;
            background: #fff;
        }
        .kb-file-name {
            font-weight: 650;
            word-break: break-word;
        }
        .kb-file-path {
            color: #6b7280;
            font-size: 12px;
            word-break: break-all;
            margin-top: 4px;
        }
        .kb-status {
            min-height: 24px;
            margin-top: 10px;
            font-size: 14px;
        }
        .kb-status.success { color: #15803d; }
        .kb-status.error { color: #b91c1c; }
        .kb-status.info { color: #1d4ed8; }
        .kb-readonly-note {
            padding: 12px;
            border-radius: 8px;
            background: #fff7ed;
            color: #9a3412;
            margin: 18px 0;
        }
        @media (max-width: 900px) {
            .kb-shell { grid-template-columns: 1fr; }
            .kb-sidebar { position: static; }
            .kb-detail-head { align-items: flex-start; flex-direction: column; }
            .kb-actions { justify-content: flex-start; }
        }
    </style>
</head>
<body>
    {% include 'components/navbar.html' %}

    <div class="main-wrapper">
        <main class="knowledge-page">
            <h1 class="page-title">知识库管理</h1>

            <div class="kb-shell">
                <aside class="kb-sidebar">
                    <div class="kb-sidebar-head">
                        <h2>知识库</h2>
                    </div>
                    <div class="kb-create-actions">
                        <button class="btn-primary small" id="createPersonalBtn" type="button">创建个人知识库</button>
                        {% if request.current_user and request.current_user.has_role('teacher', 'admin') %}
                        <button class="btn-secondary small" id="createClassBtn" type="button">发布班级知识库</button>
                        {% endif %}
                    </div>
                    <div class="kb-list" id="knowledgeBaseList">
                        <div class="loading">加载中...</div>
                    </div>
                </aside>

                <section class="kb-detail" id="knowledgeBaseDetail">
                    <div class="kb-empty-panel">
                        <div>
                            <h2>选择或创建一个知识库</h2>
                            <p>创建后即可上传文档，系统会自动解析并用于知识库问答。</p>
                            <button class="btn-primary" id="emptyCreatePersonalBtn" type="button">创建个人知识库</button>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script>
        const CURRENT_USER_ID = {{ request.current_user.id if request.current_user else 'null' }};
        const CURRENT_USER_ROLE = "{{ request.current_user.role if request.current_user else 'student' }}";
        let knowledgeBases = [];
        let selectedKnowledgeBase = null;
        let selectedSources = [];

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        function authHeaders(extra = {}) {
            const token = localStorage.getItem('token') || getCookie('token');
            return { ...extra, 'Authorization': `Bearer ${token}` };
        }

        function normalizeName(value) {
            return (value || '').trim();
        }

        function displayName(kb) {
            return kb.display_name || kb.class_name || kb.name;
        }

        function isManageable(kb) {
            return Boolean(kb && kb.can_manage);
        }

        function buildKnowledgeBaseItems(data) {
            if (Array.isArray(data.items)) {
                return data.items.map(item => ({
                    ...item,
                    class_name: item.display_name || item.class_name || item.name,
                    owner_name: item.owner_name || item.teacher_name || (item.type === 'personal' ? '我' : '用户')
                }));
            }

            const classMap = new Map((data.class_knowledge_bases || []).map(item => [item.knowledge_base, item]));
            const personalMap = new Map((data.user_knowledge_bases || []).map(item => [item.knowledge_base, item]));

            return (data.data || []).map(name => {
                if (classMap.has(name)) {
                    const item = classMap.get(name);
                    return {
                        name,
                        type: 'class',
                        class_name: item.class_name,
                        description: item.description || '',
                        teacher_id: item.teacher_id,
                        owner_name: item.teacher_name || '教师',
                        can_manage: CURRENT_USER_ROLE === 'admin' || item.teacher_id === CURRENT_USER_ID
                    };
                }
                if (personalMap.has(name)) {
                    const item = personalMap.get(name);
                    return {
                        name,
                        type: 'personal',
                        owner_id: item.owner_id,
                        owner_name: item.owner_name || '用户',
                        can_manage: CURRENT_USER_ROLE === 'admin' || item.owner_id === CURRENT_USER_ID
                    };
                }
                return {
                    name,
                    type: 'personal',
                    owner_id: CURRENT_USER_ID,
                    owner_name: '我',
                    can_manage: true
                };
            });
        }

        async function loadKnowledgeBases(selectName = null) {
            const list = document.getElementById('knowledgeBaseList');
            list.innerHTML = '<div class="loading">加载中...</div>';
            try {
                const response = await fetch('/api/knowledge-base/list', {
                    headers: authHeaders()
                });
                const data = await response.json();
                if (data.code !== 200) throw new Error(data.msg || data.error || '加载失败');

                knowledgeBases = buildKnowledgeBaseItems(data);
                renderKnowledgeBaseList();

                const targetName = selectName || selectedKnowledgeBase?.name || knowledgeBases[0]?.name;
                if (targetName) {
                    selectKnowledgeBase(targetName);
                } else {
                    renderEmptyState();
                }
            } catch (error) {
                list.innerHTML = `<div class="empty-state">加载失败：${error.message}</div>`;
                renderEmptyState();
            }
        }

        function renderKnowledgeBaseList() {
            const list = document.getElementById('knowledgeBaseList');
            if (!knowledgeBases.length) {
                list.innerHTML = '<div class="empty-state">暂无知识库</div>';
                return;
            }

            list.innerHTML = knowledgeBases.map(kb => {
                const active = selectedKnowledgeBase?.name === kb.name ? ' active' : '';
                const typeText = kb.type === 'class' ? '班级' : (kb.type === 'system' ? '系统' : '个人');
                const manageText = isManageable(kb) ? '可管理' : '只读';
                return `
                    <button class="kb-item${active}" onclick="selectKnowledgeBase('${kb.name.replace(/'/g, "\\'")}')">
                        <span class="kb-item-title">${displayName(kb)}</span>
                        <span class="kb-item-meta">
                            <span class="kb-tag ${kb.type}">${typeText}</span>
                            <span class="kb-tag ${isManageable(kb) ? '' : 'readonly'}">${manageText}</span>
                        </span>
                    </button>
                `;
            }).join('');
        }

        async function selectKnowledgeBase(name) {
            selectedKnowledgeBase = knowledgeBases.find(kb => kb.name === name) || null;
            renderKnowledgeBaseList();
            renderDetailLoading();
            if (!selectedKnowledgeBase) {
                renderEmptyState();
                return;
            }
            await loadSources();
            renderDetail();
        }

        function renderEmptyState() {
            document.getElementById('knowledgeBaseDetail').innerHTML = `
                <div class="kb-empty-panel">
                    <div>
                        <h2>创建你的第一个个人知识库</h2>
                        <p>点击创建后，页面会进入上传文档状态。</p>
                        <button class="btn-primary" type="button" onclick="showPersonalCreateForm()">创建个人知识库</button>
                    </div>
                </div>
            `;
        }

        function renderCreateForm(type) {
            const isClass = type === 'class';
            document.getElementById('knowledgeBaseDetail').innerHTML = `
                <div class="kb-detail-head">
                    <div>
                        <h2>${isClass ? '发布班级知识库' : '创建个人知识库'}</h2>
                        <p class="kb-detail-sub">${isClass ? '填写班级信息，完成后即可上传班级资料。' : '填写知识库名称，完成后即可上传文档。'}</p>
                    </div>
                </div>
                <form class="profile-form" id="createKnowledgeForm" style="max-width: 560px;">
                    <div class="form-group">
                        <label>${isClass ? '班级名称' : '知识库名称'}</label>
                        <input type="text" id="createKnowledgeName" required placeholder="${isClass ? '例如：高一数学1班' : '例如：我的数学资料'}">
                    </div>
                    ${isClass ? `
                    <div class="form-group">
                        <label>班级知识库说明（可选）</label>
                        <input type="text" id="createKnowledgeDescription" placeholder="例如：本学期函数与几何资料">
                    </div>
                    ` : ''}
                    <div class="form-actions">
                        <button type="button" class="btn-secondary" onclick="renderEmptyState()">取消</button>
                        <button type="submit" class="btn-primary">${isClass ? '完成发布' : '完成创建'}</button>
                    </div>
                </form>
                <div class="kb-status" id="kbStatus"></div>
            `;

            document.getElementById('createKnowledgeName')?.focus();
            document.getElementById('createKnowledgeForm')?.addEventListener('submit', event => {
                event.preventDefault();
                if (isClass) {
                    submitClassKnowledgeBase();
                } else {
                    submitPersonalKnowledgeBase();
                }
            });
        }

        function showPersonalCreateForm() {
            renderCreateForm('personal');
        }

        function showClassCreateForm() {
            renderCreateForm('class');
        }

        function renderDetailLoading() {
            document.getElementById('knowledgeBaseDetail').innerHTML = '<div class="loading">加载中...</div>';
        }

        async function loadSources() {
            selectedSources = [];
            if (!selectedKnowledgeBase) return;
            try {
                const response = await fetch(`/api/knowledge-base/sources?knowledge_base=${encodeURIComponent(selectedKnowledgeBase.name)}`, {
                    headers: authHeaders()
                });
                const data = await response.json();
                if (data.code === 200) selectedSources = data.data || [];
            } catch (error) {
                selectedSources = [];
            }
        }

        function renderDetail() {
            const kb = selectedKnowledgeBase;
            const canManage = isManageable(kb);
            const typeText = kb.type === 'class' ? '班级知识库' : '个人知识库';
            const ownerText = kb.type === 'class' ? `发布教师：${kb.owner_name}` : `所有人：${kb.owner_name}`;

            document.getElementById('knowledgeBaseDetail').innerHTML = `
                <div class="kb-detail-head">
                    <div>
                        <h2>${displayName(kb)}</h2>
                        <p class="kb-detail-sub">${typeText} · ${ownerText}</p>
                    </div>
                    <div class="kb-actions">
                        ${canManage ? `
                            <button class="btn-secondary small" onclick="renameKnowledgeBase()">重命名</button>
                            <button class="btn-danger small" onclick="deleteKnowledgeBase()">删除知识库</button>
                        ` : ''}
                    </div>
                </div>

                ${canManage ? renderUploadBox() : `
                    <div class="kb-readonly-note">这是只读知识库。你可以在首页答疑中选择它进行问答，但不能上传、删除或修改其中的文件。</div>
                `}

                <div class="sources-section" style="box-shadow:none;border:0;padding:0;margin:0;">
                    <div class="section-header">
                        <h3>上传文件</h3>
                        <p class="section-desc">${canManage ? '管理员、创建者或发布教师可以删除文件。' : '只读模式下仅可查看文件。'}</p>
                    </div>
                    <div class="sources-filter">
                        <input type="text" id="sourceFilter" placeholder="搜索文件名..." oninput="renderFileList()">
                    </div>
                    <div class="kb-file-list" id="fileList"></div>
                </div>
                <div class="kb-status" id="kbStatus"></div>
            `;
            bindUploadArea();
            renderFileList();
        }

        function renderUploadBox() {
            return `
                <div class="kb-upload-box">
                    <div class="kb-upload-title">上传文档</div>
                    <div class="kb-upload-area" id="uploadArea">
                        <div style="font-size:30px;margin-bottom:8px;">📁</div>
                        <div>拖拽文件到此处，或点击选择文件</div>
                        <div class="upload-hint">支持 PDF、TXT、DOCX，上传成功后会出现在文件列表中</div>
                        <input type="file" id="fileInput" accept=".pdf,.txt,.docx" multiple style="display:none;">
                    </div>
                </div>
            `;
        }

        function renderFileList() {
            const container = document.getElementById('fileList');
            if (!container) return;

            const keyword = normalizeName(document.getElementById('sourceFilter')?.value).toLowerCase();
            const canManage = isManageable(selectedKnowledgeBase);
            const sources = selectedSources.filter(source => {
                const text = `${source.file_name || ''} ${source.file_path || ''}`.toLowerCase();
                return !keyword || text.includes(keyword);
            });

            if (!sources.length) {
                container.innerHTML = '<div class="empty-state">暂无上传文件</div>';
                return;
            }

            container.innerHTML = sources.map(source => `
                <div class="kb-file-item">
                    <div>
                        <div class="kb-file-name">${source.file_name || '未知文件'}</div>
                        <div class="kb-file-path">${source.file_path || ''}</div>
                    </div>
                    ${canManage ? `<button class="btn-danger small" onclick="deleteSource('${encodeURIComponent(source.file_path || '')}')">删除</button>` : ''}
                </div>
            `).join('');
        }

        function bindUploadArea() {
            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('fileInput');
            if (!uploadArea || !fileInput) return;

            uploadArea.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', () => uploadFiles(fileInput.files));
            uploadArea.addEventListener('dragover', event => {
                event.preventDefault();
                uploadArea.classList.add('dragover');
            });
            uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
            uploadArea.addEventListener('drop', event => {
                event.preventDefault();
                uploadArea.classList.remove('dragover');
                uploadFiles(event.dataTransfer.files);
            });
        }

        async function uploadFiles(files) {
            if (!files || !files.length || !selectedKnowledgeBase) return;
            if (!isManageable(selectedKnowledgeBase)) {
                setStatus('当前知识库只读，不能上传文档', 'error');
                return;
            }

            for (const file of files) {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('knowledge_base', selectedKnowledgeBase.name);

                setStatus(`正在上传 ${file.name}...`, 'info');
                try {
                    const response = await fetch('/api/knowledge-base/upload', {
                        method: 'POST',
                        headers: authHeaders(),
                        body: formData
                    });
                    const data = await response.json();
                    if (data.code !== 200) throw new Error(data.msg || data.error || '上传失败');
                    setStatus(`${file.name} 上传成功`, 'success');
                } catch (error) {
                    setStatus(`${file.name} 上传失败：${error.message}`, 'error');
                }
            }

            await loadSources();
            renderFileList();
        }

        async function submitPersonalKnowledgeBase() {
            const name = normalizeName(document.getElementById('createKnowledgeName')?.value);
            if (!name) return;
            if (name.includes('/') || name.includes('\\') || name.includes('.')) {
                alert('知识库名称不能包含斜杠或点号');
                return;
            }

            try {
                const response = await fetch('/api/knowledge-base/create', {
                    method: 'POST',
                    headers: authHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify({ name })
                });
                const data = await response.json();
                if (data.code !== 200) throw new Error(data.msg || data.error || '创建失败');
                await loadKnowledgeBases(name);
                setStatus('个人知识库已创建，可以上传文档了', 'success');
            } catch (error) {
                setStatus(`创建失败：${error.message}`, 'error');
            }
        }

        async function submitClassKnowledgeBase() {
            const className = normalizeName(document.getElementById('createKnowledgeName')?.value);
            if (!className) return;
            const description = normalizeName(document.getElementById('createKnowledgeDescription')?.value);

            try {
                const response = await fetch('/api/knowledge-base/class/create', {
                    method: 'POST',
                    headers: authHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify({ class_name: className, description })
                });
                const data = await response.json();
                if (data.code !== 200) throw new Error(data.msg || data.error || '发布失败');
                await loadKnowledgeBases(data.data.knowledge_base);
                setStatus('班级知识库已发布，可以上传文档了', 'success');
            } catch (error) {
                setStatus(`发布失败：${error.message}`, 'error');
            }
        }

        async function renameKnowledgeBase() {
            if (!selectedKnowledgeBase || !isManageable(selectedKnowledgeBase)) return;
            const oldName = selectedKnowledgeBase.name;
            const label = selectedKnowledgeBase.type === 'class' ? '班级知识库名称' : '知识库名称';
            const newName = normalizeName(prompt(`请输入新的${label}：`, displayName(selectedKnowledgeBase)));
            if (!newName || newName === oldName) return;
            if (newName.includes('/') || newName.includes('\\') || newName.includes('.')) {
                alert('名称不能包含斜杠或点号');
                return;
            }

            try {
                const response = await fetch('/api/knowledge-base/rename', {
                    method: 'POST',
                    headers: authHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify({ old_name: oldName, new_name: newName })
                });
                const data = await response.json();
                if (data.code !== 200) throw new Error(data.msg || data.error || '重命名失败');
                await loadKnowledgeBases(newName);
                setStatus('知识库已重命名', 'success');
            } catch (error) {
                alert(`重命名失败：${error.message}`);
            }
        }

        async function deleteKnowledgeBase() {
            if (!selectedKnowledgeBase || !isManageable(selectedKnowledgeBase)) return;
            if (!confirm(`确定删除 "${displayName(selectedKnowledgeBase)}" 吗？此操作不可恢复。`)) return;

            try {
                const response = await fetch(`/api/knowledge-base/delete?knowledge_base=${encodeURIComponent(selectedKnowledgeBase.name)}`, {
                    method: 'DELETE',
                    headers: authHeaders()
                });
                const data = await response.json();
                if (data.code !== 200) throw new Error(data.msg || data.error || '删除失败');
                selectedKnowledgeBase = null;
                await loadKnowledgeBases();
            } catch (error) {
                alert(`删除失败：${error.message}`);
            }
        }

        async function deleteSource(encodedPath) {
            if (!selectedKnowledgeBase || !isManageable(selectedKnowledgeBase)) return;
            const filePath = decodeURIComponent(encodedPath);
            if (!confirm(`确定删除文件 "${filePath}" 吗？`)) return;

            try {
                const response = await fetch(`/api/knowledge-base/sources/${encodedPath}?knowledge_base=${encodeURIComponent(selectedKnowledgeBase.name)}`, {
                    method: 'DELETE',
                    headers: authHeaders()
                });
                const data = await response.json();
                if (data.code !== 200) throw new Error(data.msg || data.error || '删除失败');
                setStatus('文件已删除', 'success');
                await loadSources();
                renderFileList();
            } catch (error) {
                setStatus(`删除失败：${error.message}`, 'error');
            }
        }

        function setStatus(message, type = 'info') {
            const status = document.getElementById('kbStatus');
            if (!status) {
                alert(message);
                return;
            }
            status.textContent = message;
            status.className = `kb-status ${type}`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('createPersonalBtn')?.addEventListener('click', showPersonalCreateForm);
            document.getElementById('createClassBtn')?.addEventListener('click', showClassCreateForm);
            document.getElementById('emptyCreatePersonalBtn')?.addEventListener('click', showPersonalCreateForm);
            loadKnowledgeBases();
        });
    </script>
    <script src="/static/js/shared.js?v=fix-text-20260612"></script>
</body>
</html>
